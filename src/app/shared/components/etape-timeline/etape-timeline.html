<div class="etape" [class]="'etape-' + etat()">
  <div class="cercle">
    @if (etat() === 'fait') {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m5 12 4 4L19 6" />
      </svg>
    } @else {
      <span>{{ numero() }}</span>
    }
  </div>
  <div class="texte">
    <div class="label">{{ label() }}</div>
    @if (sousTexte()) {
      <div class="sous-texte">{{ sousTexte() }}</div>
    }
  </div>
</div>
